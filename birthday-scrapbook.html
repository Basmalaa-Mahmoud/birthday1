<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Birthday 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF4F8;
    --bg2:#FFEAF3;
    --card:#FFFDFC;
    --pink-1:#FFE1EC;
    --pink-2:#FFC2DA;
    --pink-hot:#FF5FA8;
    --pink-hot-dark:#E8408E;
    --iri-1:#FFD9EC;
    --iri-2:#E3C6FF;
    --iri-3:#C6F0FF;
    --ink:#7A3B57;
    --muted:#C08BA3;
    --sticker:#FF8FBE;
    --shadow: 255,140,190;
  }
  html[data-theme="lavender"]{
    --bg:#F8F2FC;
    --bg2:#F0E3FA;
    --card:#FFFCFF;
    --pink-1:#F0DCF5;
    --pink-2:#E0BEEF;
    --pink-hot:#C568E0;
    --pink-hot-dark:#A94CC4;
    --iri-1:#EBD8FF;
    --iri-2:#D8C6FF;
    --iri-3:#FFD6F0;
    --ink:#5F3966;
    --muted:#B896C4;
    --sticker:#D68FEF;
    --shadow: 200,140,230;
  }
  html[data-theme="peach"]{
    --bg:#FFF6EE;
    --bg2:#FFEADA;
    --card:#FFFDFB;
    --pink-1:#FFE3D0;
    --pink-2:#FFC7A6;
    --pink-hot:#FF7A8A;
    --pink-hot-dark:#F2586B;
    --iri-1:#FFE1D0;
    --iri-2:#FFD1E0;
    --iri-3:#FFF0C8;
    --ink:#8A4B45;
    --muted:#D3A290;
    --sticker:#FF9E85;
    --shadow: 255,170,140;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, var(--iri-1) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 15%, var(--iri-2) 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
    min-height:100vh;
  }

  /* ---------- Fluffy container base ---------- */
  .fluffy{
    background:var(--card);
    border:7px solid #fff;
    border-radius: 40% 60% 62% 38% / 45% 40% 60% 55%;
    box-shadow:
      0 0 0 3px var(--pink-1),
      0 14px 28px -8px rgba(var(--shadow),.45),
      inset 0 0 30px rgba(255,255,255,.7);
    position:relative;
  }
  .fluffy.blob2{ border-radius: 62% 38% 42% 58% / 55% 62% 38% 45%; }
  .fluffy.blob3{ border-radius: 48% 52% 58% 42% / 40% 48% 52% 60%; }
  .fluffy::after{
    content:"";
    position:absolute; inset:-10px;
    border-radius:inherit;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 60%);
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:.8;
  }

  /* ---------- Doodle layer ---------- */
  #doodleLayer{
    position:absolute; top:0; left:0; width:100%;
    pointer-events:none; z-index:3;
  }
  .doodle{ position:absolute; opacity:.9; filter:drop-shadow(0 2px 3px rgba(var(--shadow),.25)); animation:doodleFloat 5s ease-in-out infinite; }
  @keyframes doodleFloat{ 0%,100%{transform:translateY(0) rotate(var(--r,0deg));} 50%{transform:translateY(-8px) rotate(var(--r,0deg));} }

  /* ---------- Ambient background sparkle ---------- */
  .bg-sparkle{ position:fixed; z-index:0; pointer-events:none; opacity:.5; animation:twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15; transform:scale(.8);} 50%{opacity:.7; transform:scale(1.1);} }

  /* ================= HEADER / BANNER ================= */
  .banner{
    position:relative; z-index:4;
    padding:38px 20px 28px;
    text-align:center;
    overflow:hidden;
  }
  .lights{
    display:flex; justify-content:space-between; padding:0 4px 18px;
  }
  .lights span{
    width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--pink-hot));
    box-shadow:0 0 8px 2px rgba(var(--shadow),.7);
    animation:blink 1.6s ease-in-out infinite;
  }
  .lights span:nth-child(2n){animation-delay:.3s;}
  .lights span:nth-child(3n){animation-delay:.6s;}
  .lights span:nth-child(4n){animation-delay:.9s;}
  @keyframes blink{ 0%,100%{opacity:.4; transform:scale(.85);} 50%{opacity:1; transform:scale(1.15);} }

  .banner-title{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    font-size:clamp(2rem, 9vw, 2.9rem);
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--pink-hot-dark), var(--pink-hot), var(--iri-2), var(--pink-hot));
    background-size:300% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 5s linear infinite;
    outline:none;
    line-height:1.15;
  }
  @keyframes shimmer{ to{ background-position:300% center; } }
  .banner-title .name{ text-decoration: wavy underline var(--pink-hot); text-underline-offset:6px; }

  .banner-sub{
    font-family:'Caveat', cursive;
    font-size:1.4rem;
    color:var(--ink);
    max-width:340px; margin:6px auto 18px;
    outline:none;
  }
  [contenteditable]:empty:before{ content:attr(data-placeholder); color:var(--muted); }

  .theme-switcher{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; padding:8px 14px; border-radius:30px;
    box-shadow:0 6px 18px rgba(var(--shadow),.3);
    font-size:.8rem; font-weight:600;
  }
  .theme-switcher button{
    width:22px;height:22px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 2px var(--muted);
    cursor:pointer;
  }
  .theme-switcher button[data-theme="blush"]{background:linear-gradient(135deg,#FFE1EC,#FF5FA8);}
  .theme-switcher button[data-theme="lavender"]{background:linear-gradient(135deg,#F0DCF5,#C568E0);}
  .theme-switcher button[data-theme="peach"]{background:linear-gradient(135deg,#FFE3D0,#FF7A8A);}
  .theme-switcher button.active{box-shadow:0 0 0 3px var(--pink-hot-dark);}

  /* ================= MUSIC PLAYER ================= */
  .music-wrap{ position:relative; z-index:4; padding:0 20px 26px; }
  .player-card{
    padding:16px 18px 18px;
    max-width:420px; margin:0 auto;
  }
  .player-head{
    font-family:'Baloo 2', cursive; font-weight:700; font-size:1.05rem;
    margin-bottom:10px; text-align:center; color:var(--pink-hot-dark);
  }
  .player-body{ display:flex; align-items:center; gap:14px; }
  .play-btn{
    flex:0 0 auto; width:52px; height:52px; border-radius:50%;
    border:none; cursor:pointer;
    background:linear-gradient(145deg, var(--pink-hot), var(--pink-hot-dark));
    color:#fff; font-size:1.2rem;
    box-shadow:0 6px 14px rgba(var(--shadow),.55);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .play-btn:active{ transform:scale(.9); }
  .track-info{ flex:1; min-width:0; }
  .track-name{ font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px;}
  .bars{ display:flex; align-items:flex-end; gap:3px; height:18px; }
  .bars span{
    width:4px; border-radius:2px; background:var(--pink-hot);
    height:20%; transition:height .15s;
  }
  .bars.playing span{ animation:eq 1s ease-in-out infinite; }
  .bars span:nth-child(1){animation-delay:.0s;} .bars span:nth-child(2){animation-delay:.15s;}
  .bars span:nth-child(3){animation-delay:.3s;} .bars span:nth-child(4){animation-delay:.1s;}
  .bars span:nth-child(5){animation-delay:.25s;}
  @keyframes eq{ 0%,100%{height:20%;} 50%{height:90%;} }

  .player-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:8px; flex-wrap:wrap; }
  .upload-btn{
    font-size:.75rem; font-weight:700; background:var(--pink-1); color:var(--pink-hot-dark);
    padding:8px 12px; border-radius:20px; cursor:pointer; border:1.5px dashed var(--pink-hot);
  }
  .autoplay-toggle{ font-size:.72rem; color:var(--muted); display:flex; align-items:center; gap:5px; }

  /* ================= COLLAGE ================= */
  .collage{
    position:relative; z-index:4;
    display:flex; flex-direction:column; gap:6px;
    padding:10px 5vw 40px;
  }
  .item{
    max-width:80%; width:fit-content;
    padding:16px;
    transition:transform .25s ease;
  }
  .item.self-start{ align-self:flex-start; margin-left:0; }
  .item.self-end{ align-self:flex-end; margin-right:0; }
  .item:hover{ transform:rotate(0deg) scale(1.02) !important; z-index:10; }

  .rot-1{ transform:rotate(-5deg); }
  .rot-2{ transform:rotate(4deg); }
  .rot-3{ transform:rotate(-3deg); }
  .rot-4{ transform:rotate(6deg); }
  .rot-5{ transform:rotate(-6deg); }
  .rot-6{ transform:rotate(2deg); }
  .up{ margin-top:-14px; }

  .photo-slot{
    width:56vw; max-width:250px; aspect-ratio: 4/5;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; padding:0;
  }
  .photo-slot.wide{ width:66vw; max-width:290px; aspect-ratio:5/4; }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; border-radius:inherit; }
  .photo-slot .placeholder{
    text-align:center; font-size:.8rem; color:var(--muted); font-weight:600; padding:10px;
    font-family:'Quicksand'; line-height:1.5;
  }
  .photo-slot .placeholder .plus{ font-size:1.8rem; display:block; color:var(--pink-hot); }
  .photo-slot input{ display:none; }

  .note{
    font-family:'Caveat', cursive;
    font-size:1.35rem;
    line-height:1.35;
    color:var(--ink);
    width:58vw; max-width:260px;
    outline:none;
  }
  .note[contenteditable]:empty:before{ font-family:'Caveat', cursive; font-size:1.3rem; }
  .tape{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:60px; height:20px; background:rgba(255,255,255,.65);
    border:1px solid rgba(var(--shadow),.3);
  }

  /* ================= GIFT / SURPRISE ================= */
  .gift-section{
    position:relative; z-index:4;
    display:flex; flex-direction:column; align-items:center;
    padding:30px 20px 40px; text-align:center;
  }
  .gift-box{
    font-size:4rem; cursor:pointer; user-select:none;
    animation:wiggle 2.4s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(var(--shadow),.4));
  }
  @keyframes wiggle{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
  .gift-box.popped{ animation:pop .5s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.35) rotate(0deg);} 100%{transform:scale(1) rotate(0deg);} }
  .gift-hint{ font-family:'Caveat', cursive; font-size:1.2rem; color:var(--pink-hot-dark); margin-top:6px; }
  .gift-message{
    margin-top:18px; max-width:280px;
    padding:18px; font-family:'Caveat', cursive; font-size:1.3rem;
    opacity:0; max-height:0; overflow:hidden;
    transition:all .5s ease;
  }
  .gift-message.show{ opacity:1; max-height:300px; padding:18px; }

  /* ================= FOOTER ================= */
  footer{
    position:relative; z-index:4;
    text-align:center; padding:20px 20px 50px;
    font-family:'Caveat', cursive; font-size:1.3rem; color:var(--ink);
  }
  footer .stamp{ font-size:1.6rem; margin-top:6px; }

  /* ================= EDIT MODE TOGGLE ================= */
  .rearrange-btn{
    position:fixed; bottom:18px; right:18px; z-index:50;
    background:linear-gradient(145deg, var(--pink-hot), var(--pink-hot-dark));
    color:#fff; border:none; border-radius:30px; padding:12px 16px;
    font-family:'Quicksand'; font-weight:700; font-size:.8rem;
    box-shadow:0 8px 20px rgba(var(--shadow),.5); cursor:pointer;
  }
  .collage.edit-mode .item{
    outline:2px dashed var(--pink-hot);
    outline-offset:4px;
    cursor:grab;
  }
  .collage.edit-mode .item.dragging{ opacity:.4; }

  /* ================= CONFETTI CANVAS ================= */
  #confettiCanvas{
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:100;
  }

  ::selection{ background:var(--pink-2); }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div id="doodleLayer"></div>

<!-- ================= BANNER ================= -->
<header class="banner" id="banner">
  <div class="lights">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <h1 class="banner-title" contenteditable="true" spellcheck="false">
    Happy Birthday, <span class="name" contenteditable="true">my motuu</span>! 🎀
  </h1>
  <p class="banner-sub" contenteditable="true" data-placeholder="[Add a sweet subtitle here — like 'my forever person']"></p>

  <div class="theme-switcher">
    <span>theme</span>
    <button data-theme="blush" class="active" aria-label="Blush theme"></button>
    <button data-theme="lavender" aria-label="Lavender theme"></button>
    <button data-theme="peach" aria-label="Peach theme"></button>
  </div>
</header>

<!-- ================= MUSIC PLAYER ================= -->
<section class="music-wrap">
  <div class="player-card fluffy blob2">
    <div class="player-head">🎧 Play Our Mix</div>
    <audio id="audio" loop></audio>
    <div class="player-body">
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <div class="track-info">
        <div class="track-name" id="trackName">No song yet — upload your mix below 💌</div>
        <div class="bars" id="bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div class="player-actions">
      <label class="upload-btn">+ Upload Song
        <input type="file" id="songInput" accept="audio/*">
      </label>
      <label class="autoplay-toggle">
        <input type="checkbox" id="autoplayToggle"> autoplay for guests
      </label>
    </div>
  </div>
</section>

<!-- ================= COLLAGE ================= -->
<main class="collage" id="collage">

  <div class="item self-start rot-1" draggable="false">
    <div class="photo-slot fluffy blob1">
      <div class="placeholder"><span class="plus">+</span>add photo</div>
      <input type="file" accept="image/*">
    </div>
  </div>

  <div class="item self-end rot-2 up" draggable="false">
    <div class="note fluffy blob2" contenteditable="true" data-placeholder="[Add personalized happy birthday message here]"></div>
  </div>

  <div class="item self-start rot-3" draggable="false">
    <div class="photo-slot wide fluffy blob3">
      <div class="placeholder"><span class="plus">+</span>add photo</div>
      <input type="file" accept="image/*">
    </div>
  </div>

  <div class="item self-end rot-4 up" draggable="false">
    <div class="note fluffy blob1" contenteditable="true" data-placeholder="[Write your favorite memory together here]"></div>
  </div>

  <div class="item self-start rot-5" draggable="false">
    <div class="note fluffy blob3" contenteditable="true" data-placeholder="[Add an inside joke here]"></div>
  </div>

  <div class="item self-end rot-1" draggable="false">
    <div class="photo-slot fluffy blob2">
      <div class="placeholder"><span class="plus">+</span>add photo</div>
      <input type="file" accept="image/*">
    </div>
  </div>

  <div class="item self-start rot-6 up" draggable="false">
    <div class="photo-slot wide fluffy blob1">
      <div class="placeholder"><span class="plus">+</span>add photo</div>
      <input type="file" accept="image/*">
    </div>
  </div>

  <div class="item self-end rot-3" draggable="false">
    <div class="note fluffy blob2" contenteditable="true" data-placeholder="[Add why you're grateful for them]"></div>
  </div>

  <div class="item self-start rot-2" draggable="false">
    <div class="note fluffy blob3" contenteditable="true" data-placeholder="[Add a birthday wish for the year ahead]"></div>
  </div>

  <div class="item self-end rot-5 up" draggable="false">
    <div class="photo-slot fluffy blob1">
      <div class="placeholder"><span class="plus">+</span>add photo</div>
      <input type="file" accept="image/*">
    </div>
  </div>

</main>

<!-- ================= GIFT SURPRISE ================= -->
<section class="gift-section confetti-trigger" id="giftSection">
  <div class="gift-box" id="giftBox">🎁</div>
  <div class="gift-hint">tap for a surprise</div>
  <div class="gift-message fluffy blob2" id="giftMessage" contenteditable="true" data-placeholder="[Add your surprise message here]"></div>
</section>

<!-- more scattered content -->
<main class="collage confetti-trigger" id="collage2">
  <div class="item self-start rot-4" draggable="false">
    <div class="photo-slot wide fluffy blob2">
      <div class="placeholder"><span class="plus">+</span>add photo</div>
      <input type="file" accept="image/*">
    </div>
  </div>
  <div class="item self-end rot-6 up" draggable="false">
    <div class="note fluffy blob1" contenteditable="true" data-placeholder="[Add one more thing you love about them]"></div>
  </div>
</main>

<footer>
  <p contenteditable="true" data-placeholder="[Add your closing note here]"></p>
  <div class="stamp">🩷 made with love</div>
</footer>

<button class="rearrange-btn" id="rearrangeBtn">✏️ rearrange</button>

<script>
/* ============ DOODLE STICKERS ============ */
const doodleSVGs = {
  heart: `<svg viewBox="0 0 24 24" width="{s}" height="{s}"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.3 2.2 4.5 6 4c2-.3 3.6.7 6 3 2.4-2.3 4-3.3 6-3 3.8.5 5.6 4.3 4 7.7C19.5 16.4 12 21 12 21z" fill="{c}"/></svg>`,
  bow: `<svg viewBox="0 0 48 32" width="{s}" height="{s}"><path d="M22 16C22 8 14 4 6 6 2 7 1 12 4 15c3 3 12 3 18 1z" fill="{c}"/><path d="M26 16c0-8 8-12 16-10 4 1 5 6 2 9-3 3-12 3-18 1z" fill="{c}"/><circle cx="24" cy="16" r="4" fill="{c2}"/></svg>`,
  star: `<svg viewBox="0 0 24 24" width="{s}" height="{s}"><path d="M12 1l2.9 7.2L22 9l-5.6 5 1.7 7.4L12 17.8 5.9 21.4 7.6 14 2 9l7.1-.8z" fill="{c}"/></svg>`,
  cloud: `<svg viewBox="0 0 48 30" width="{s}" height="{s}"><path d="M12 24c-6 0-10-4-10-9s4-8 9-8c1-4 5-7 10-7 5 0 9 3 10 7 5 0 9 4 9 8s-4 9-10 9z" fill="{c}"/><circle cx="16" cy="13" r="1.3" fill="#7A3B57"/><circle cx="27" cy="13" r="1.3" fill="#7A3B57"/><path d="M17 18c2 2 6 2 8 0" stroke="#7A3B57" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>`,
  tulip: `<svg viewBox="0 0 24 34" width="{s}" height="{s}"><path d="M12 2c-3 3-3 8 0 12 3-4 3-9 0-12z" fill="{c}"/><path d="M5 6c0 5 3 8 7 8-1-4-3-7-7-8z" fill="{c2}"/><path d="M19 6c0 5-3 8-7 8 1-4 3-7 7-8z" fill="{c2}"/><line x1="12" y1="14" x2="12" y2="32" stroke="#8FBF8F" stroke-width="2"/></svg>`,
  bear: `<svg viewBox="0 0 40 40" width="{s}" height="{s}"><circle cx="9" cy="7" r="4" fill="{c}"/><circle cx="31" cy="7" r="4" fill="{c}"/><circle cx="20" cy="20" r="15" fill="{c}"/><circle cx="14" cy="18" r="1.6" fill="#7A3B57"/><circle cx="26" cy="18" r="1.6" fill="#7A3B57"/><ellipse cx="20" cy="24" rx="3.5" ry="2.5" fill="#7A3B57" opacity=".3"/><path d="M16 26c2 2 6 2 8 0" stroke="#7A3B57" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>`,
  sparkle: `<svg viewBox="0 0 24 24" width="{s}" height="{s}"><path d="M12 2l1.8 7.2L21 11l-7.2 1.8L12 20l-1.8-7.2L3 11l7.2-1.8z" fill="{c}"/></svg>`
};

function makeDoodle(type, x, y, size, rotate, color, color2){
  const tpl = doodleSVGs[type];
  const svg = tpl.replaceAll('{s}', size).replaceAll('{c}', color).replaceAll('{c2}', color2||color);
  const wrap = document.createElement('div');
  wrap.className = 'doodle';
  wrap.style.left = x + '%';
  wrap.style.top = y + 'px';
  wrap.style.setProperty('--r', rotate + 'deg');
  wrap.style.transform = `rotate(${rotate}deg)`;
  wrap.style.animationDelay = (Math.random()*3)+'s';
  wrap.innerHTML = svg;
  return wrap;
}

function scatterDoodles(){
  const layer = document.getElementById('doodleLayer');
  layer.innerHTML = '';
  const pageHeight = document.body.scrollHeight;
  layer.style.height = pageHeight + 'px';

  const types = ['heart','bow','star','cloud','tulip','bear','sparkle'];
  const rootStyles = getComputedStyle(document.documentElement);
  const pinkHot = rootStyles.getPropertyValue('--pink-hot').trim();
  const pink2 = rootStyles.getPropertyValue('--pink-2').trim();
  const iri2 = rootStyles.getPropertyValue('--iri-2').trim();
  const palette = [pinkHot, pink2, iri2, '#ffffff'];

  const count = Math.max(40, Math.floor(pageHeight/70));
  for(let i=0;i<count;i++){
    const type = types[Math.floor(Math.random()*types.length)];
    const x = Math.random()*90 + 2;
    const y = Math.random()*(pageHeight-100) + 40;
    const size = 14 + Math.random()*20;
    const rotate = Math.random()*60 - 30;
    const color = palette[Math.floor(Math.random()*palette.length)];
    layer.appendChild(makeDoodle(type, x, y, size, rotate, color, pink2));
  }
}

window.addEventListener('load', ()=>{ setTimeout(scatterDoodles, 200); });
window.addEventListener('resize', ()=>{ clearTimeout(window._dt); window._dt = setTimeout(scatterDoodles, 300); });

/* ============ THEME SWITCHER ============ */
document.querySelectorAll('.theme-switcher button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.documentElement.setAttribute('data-theme', btn.dataset.theme);
    document.querySelectorAll('.theme-switcher button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    setTimeout(scatterDoodles, 100);
  });
});

/* ============ PHOTO UPLOAD ============ */
document.querySelectorAll('.photo-slot').forEach(slot=>{
  const input = slot.querySelector('input[type=file]');
  slot.addEventListener('click', ()=> input.click());
  input.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      slot.innerHTML = `<img src="${ev.target.result}" alt="memory photo">`;
    };
    reader.readAsDataURL(file);
  });
});

/* ============ MUSIC PLAYER ============ */
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const trackName = document.getElementById('trackName');
const bars = document.getElementById('bars');
const songInput = document.getElementById('songInput');
const autoplayToggle = document.getElementById('autoplayToggle');

songInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  audio.src = url;
  trackName.textContent = file.name.replace(/\.[^/.]+$/, '');
  if(autoplayToggle.checked){
    audio.play().then(()=>{
      playBtn.textContent = '❚❚';
      bars.classList.add('playing');
    }).catch(()=>{});
  }
});

playBtn.addEventListener('click', ()=>{
  if(!audio.src){ songInput.click(); return; }
  if(audio.paused){
    audio.play();
    playBtn.textContent = '❚❚';
    bars.classList.add('playing');
  } else {
    audio.pause();
    playBtn.textContent = '▶';
    bars.classList.remove('playing');
  }
});

/* ============ GIFT SURPRISE ============ */
const giftBox = document.getElementById('giftBox');
const giftMessage = document.getElementById('giftMessage');
giftBox.addEventListener('click', ()=>{
  giftBox.classList.remove('popped');
  void giftBox.offsetWidth;
  giftBox.classList.add('popped');
  giftMessage.classList.toggle('show');
  burstConfetti(window.innerWidth/2, giftBox.getBoundingClientRect().top + window.scrollY);
});

/* ============ CONFETTI ============ */
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let particles = [];
function burstConfetti(x, yDoc){
  const y = yDoc - window.scrollY;
  const rootStyles = getComputedStyle(document.documentElement);
  const colors = [
    rootStyles.getPropertyValue('--pink-hot').trim(),
    rootStyles.getPropertyValue('--pink-2').trim(),
    rootStyles.getPropertyValue('--iri-2').trim(),
    '#ffffff'
  ];
  for(let i=0;i<45;i++){
    particles.push({
      x: x, y: y,
      vx: (Math.random()-0.5)*8,
      vy: Math.random()*-8 - 2,
      size: 5 + Math.random()*5,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*10,
      life: 100
    });
  }
}

function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += 0.25;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1.4;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI/180);
    ctx.globalAlpha = Math.max(p.life/100, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
    ctx.restore();
  });
  particles = particles.filter(p=>p.life>0 && p.y < canvas.height + 50);
  requestAnimationFrame(animateConfetti);
}
animateConfetti();

/* scroll-triggered confetti */
const triggers = document.querySelectorAll('.confetti-trigger');
const seen = new WeakSet();
const io = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting && !seen.has(entry.target)){
      seen.add(entry.target);
      const rect = entry.target.getBoundingClientRect();
      burstConfetti(window.innerWidth/2 + (Math.random()*120-60), rect.top + window.scrollY + 20);
    }
  });
}, {threshold:0.4});
triggers.forEach(t=> io.observe(t));

/* banner load confetti */
window.addEventListener('load', ()=>{
  setTimeout(()=> burstConfetti(window.innerWidth/2, 60), 400);
});

/* ============ DRAG TO REARRANGE ============ */
const rearrangeBtn = document.getElementById('rearrangeBtn');
const collages = [document.getElementById('collage'), document.getElementById('collage2')];
let editMode = false;
let dragEl = null;

rearrangeBtn.addEventListener('click', ()=>{
  editMode = !editMode;
  collages.forEach(c=>c.classList.toggle('edit-mode', editMode));
  document.querySelectorAll('.item').forEach(it=> it.setAttribute('draggable', editMode));
  rearrangeBtn.textContent = editMode ? '✓ done' : '✏️ rearrange';
});

document.querySelectorAll('.item').forEach(item=>{
  item.addEventListener('dragstart', (e)=>{
    if(!editMode){ e.preventDefault(); return; }
    dragEl = item;
    setTimeout(()=> item.classList.add('dragging'), 0);
  });
  item.addEventListener('dragend', ()=>{
    item.classList.remove('dragging');
    dragEl = null;
    setTimeout(scatterDoodles, 200);
  });
});

collages.forEach(collage=>{
  collage.addEventListener('dragover', (e)=>{
    if(!editMode || !dragEl) return;
    e.preventDefault();
    const afterEl = getDragAfterElement(collage, e.clientY);
    if(afterEl == null){
      collage.appendChild(dragEl);
    } else {
      collage.insertBefore(dragEl, afterEl);
    }
  });
});

function getDragAfterElement(container, y){
  const items = [...container.querySelectorAll('.item:not(.dragging)')];
  return items.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset){
      return {offset: offset, element: child};
    } else {
      return closest;
    }
  }, {offset: -Infinity}).element;
}
</script>
